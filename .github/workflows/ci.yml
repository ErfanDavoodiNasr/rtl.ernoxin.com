name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm run test

      - name: Coverage (critical modules)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Chromium)
        run: npx playwright test --project=chromium

      - name: Generate og-image
        run: npm run og-image

      - name: Verify og-image exists
        run: test -f public/og-image.png

      - name: Verify production bundle is self-hosted
        run: |
          # Static scan of first-party assets (vendor chunks may embed inert doc URLs).
          if grep -R -E "cdn\.jsdelivr|unpkg\.com|cdnjs\.cloudflare|fonts\.googleapis|fonts\.gstatic" dist --include='*.html' --include='index-*.js' --include='react-*.js' --include='*.css'; then
            echo "CDN reference found in first-party dist assets"
            exit 1
          fi

      - name: Verify release zip layout
        run: |
          cd dist
          zip -qr ../rtl.zip .
          cd ..
          mkdir -p /tmp/rtl-extract
          unzip -q -o rtl.zip -d /tmp/rtl-extract
          test -f /tmp/rtl-extract/index.html
          test -f /tmp/rtl-extract/.htaccess
          grep -q 'src="./assets/' /tmp/rtl-extract/index.html
          ! grep -q 'connect-src[^"]*ws:' /tmp/rtl-extract/index.html || (echo 'dev websocket CSP leaked' && exit 1)
